# ============================================================================
# DOCKER COMPOSE: A.R.E.S. v2.6 Ecosystem
# Despliegue completo: Frontend (Nginx) + Backend (Node 24) + SQLite Persistente
# Perfiles opcionales: PostgreSQL 16 (pgvector) y Redis 7
# ============================================================================

services:
  # --------------------------------------------------------------------------
  # 1. Backend Core API (Express 5 + Gemini SDK + node:sqlite)
  # --------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ares-backend
    restart: unless-stopped
    ports:
      # Solo accesible desde tu propia máquina. El frontend (nginx) llega al backend por la red interna de Docker.
      - "127.0.0.1:3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DB_DRIVER=${DB_DRIVER:-sqlite}
      - SQLITE_DB_PATH=/app/database/ares.db
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      # Clave de acceso a la API (obligatoria en producción). Genérala con:  openssl rand -hex 32
      - ARES_API_KEY=${ARES_API_KEY:?Define ARES_API_KEY en el archivo .env (openssl rand -hex 32)}
      # Saltos de proxy delante del backend (nginx del frontend = 1). Sirve para que el límite de peticiones vea la IP real.
      - TRUST_PROXY_HOPS=${TRUST_PROXY_HOPS:-1}
      - GEMINI_TEXT_MODEL=${GEMINI_TEXT_MODEL:-gemini-3-flash-preview}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_DEFAULT_MODEL=${OPENROUTER_DEFAULT_MODEL:-deepseek/deepseek-chat}
      - LLM_PROVIDER=${LLM_PROVIDER:-openrouter}
      # Orígenes (separados por coma) desde los que un navegador puede llamar a la API. '*' está prohibido en producción.
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost,http://localhost:5173}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - DATABASE_URL=${DATABASE_URL:-postgresql://ares_commander:ares_dev_2026@postgres:5432/ares_db}
    volumes:
      # Volumen NOMBRADO (no una carpeta del repo): Docker le da el dueño correcto (usuario "node")
      - ares_data:/app/database
    networks:
      default:
        aliases:
          - ares-backend
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # --------------------------------------------------------------------------
  # 2. Frontend Tactical HUD (Vue 3 + Vite + Three.js + Nginx Alpine)
  # --------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ares-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      - BACKEND_URL=http://backend:3000
      - BACKEND_HOST=backend
    depends_on:
      - backend

  # --------------------------------------------------------------------------
  # 3. Base de Datos PostgreSQL 16 con pgvector (Opcional / Perfil: 'full')
  # --------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ares-postgres
    restart: unless-stopped
    profiles: ["full", "postgres"]
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ares_db
      POSTGRES_USER: ares_commander
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ares_dev_2026}
    volumes:
      - ares_pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ares_commander -d ares_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --------------------------------------------------------------------------
  # 4. Caché Redis 7 (Opcional / Perfil: 'full')
  # --------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: ares-redis
    restart: unless-stopped
    profiles: ["full", "redis"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ares_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ares_data:
    driver: local
  ares_pgdata:
    driver: local
  ares_redis:
    driver: local
