name: 🌐 Deploy A.R.E.S. Web HUD to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    name: 🏗️ Compilar Frontend SPA
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 📦 Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: 🔨 Compilar con Vite
        working-directory: frontend
        run: npm run build

      - name: 📤 Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    name: 🚀 Desplegar en GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 🌐 Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
