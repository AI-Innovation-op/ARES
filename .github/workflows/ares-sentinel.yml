name: ARES Sentinel - Architecture

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: architecture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Arquitectura CLI (AST)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Comprobar imports, capas y ciclos
        run: node dist/index.js analyze src --fail-on any --output ../architecture-report.md
      - name: Conservar informe en el resumen de la ejecución
        if: always()
        shell: bash
        run: |
          if [ -f ../architecture-report.md ]; then
            cat ../architecture-report.md >> "$GITHUB_STEP_SUMMARY"
          fi
