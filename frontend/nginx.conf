server {
    listen 80;
    server_name localhost;

    # Compresión Gzip para optimizar transferencia de bundles
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Resolver DNS dinámico (Cloudflare, Google y Docker)
    resolver 1.1.1.1 8.8.8.8 127.0.0.11 valid=30s ipv6=off;
    set $backend_upstream "https://ares-backend-ozs5.onrender.com";

    # Servir archivos estáticos del build de Vue 3
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy inverso para las rutas de la API de A.R.E.S. y Server-Sent Events (SSE)
    location /api/ {
        proxy_pass $backend_upstream/api/;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host ares-backend-ozs5.onrender.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Crítico para Server-Sent Events (Streaming SSE en tiempo real de tokens)
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Healthcheck del servidor Nginx y Backend
    location /health {
        proxy_pass $backend_upstream/health;
        proxy_ssl_server_name on;
        proxy_set_header Host ares-backend-ozs5.onrender.com;
    }
}
